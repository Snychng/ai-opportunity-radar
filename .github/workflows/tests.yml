name: Tests

on:
  push:
  pull_request:

permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-latest
    env:
      AOR_OFFLINE: "1"
      PYTHONDONTWRITEBYTECODE: "1"
    strategy:
      matrix:
        python-version: ["3.10", "3.12"]
    steps:
      - uses: actions/checkout@v7
        with:
          persist-credentials: false
      - uses: actions/setup-python@v7
        with:
          python-version: "${{ matrix.python-version }}"
      - run: python -m pip install -r requirements-dev.txt
      - run: python -m unittest discover -s tests -v
      - run: ruff check scripts tests
      - run: python scripts/radar.py --help
      - name: 验证发行包可以独立启动
        run: |
          python scripts/build_release.py --ref HEAD --output-dir "$RUNNER_TEMP/aor-dist"
          cd "$RUNNER_TEMP/aor-dist"
          shasum -a 256 -c SHA256SUMS
          mkdir "$RUNNER_TEMP/aor-package"
          tar -xzf aor-*.tar.gz -C "$RUNNER_TEMP/aor-package"
          python "$RUNNER_TEMP/aor-package/ai-opportunity-radar/scripts/radar.py" doctor --offline --json
